name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Gated at internal/* >= 85% line coverage — mirrors `make cover`
  # exactly (see the Makefile's own comment for scope/rationale).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make cover

  # Linux-only: go test -race needs cgo/a real C compiler, which this
  # project's own dev environment (where the rest of this workflow was
  # authored) doesn't have — ubuntu-latest's preinstalled gcc is the one
  # place in this whole setup that verification could actually run.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make race

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fuzz

  # deps-proof.txt must always be empty — this job regenerates it fresh
  # and fails if anything non-stdlib shows up, rather than trusting the
  # checked-in file not to drift.
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Zero-dependency proof must be empty
        run: |
          make proof
          if [ -s deps-proof.txt ]; then
            echo "deps-proof.txt is NOT empty — a non-stdlib dependency crept in:"
            cat deps-proof.txt
            exit 1
          fi
          echo "zero-dependency proof: clean"

  # Blocking, not advisory: Reproducible Build is this project's one
  # declared bonus, so it stays continuously true rather than checked
  # once and hoped for.
  repro-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make repro-check
